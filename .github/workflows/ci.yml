name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Only GitHub-owned actions, pinned to commit SHAs. Tag in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@12.14.0

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Installs the version from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust format
        run: pnpm rust:fmt

      - name: Clippy
        run: pnpm rust:clippy

      - name: Rust tests
        run: pnpm rust:test

      # Tests marked #[ignore] need administrator rights (symbolic links), which
      # the runner has and a normal developer account does not.
      - name: Rust tests with administrator rights
        run: pnpm rust:test:admin

      - name: Release build without installers
        run: pnpm tauri build --no-bundle

      # The runner is elevated, and WebView2 ignores WEBVIEW2_* environment
      # variables in elevated apps; only machine-wide policies apply. This sets
      # the fixture's debugging port for liurium.exe on the runner only (ADR-0019).
      - name: Debugging port policy for end-to-end tests
        run: |
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          "Elevated: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'liurium.exe' -Value '--remote-debugging-port=9333' -PropertyType String -Force | Out-Null

      # Drives that release build over the Chrome DevTools Protocol (ADR-0019).
      - name: End-to-end tests
        run: pnpm e2e
