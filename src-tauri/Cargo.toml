[package]
name = "liurium"
version = "0.1.0"
description = "Local-first developer workspace"
authors = ["GreatMightyCrow"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liurium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# Native folder dialog, opened from Rust so the page needs no dialog permission (M2-005).
# Also the question before closing with unsaved changes (M3-003); custom button names
# need Common Controls v6, which the default Tauri app manifest already declares.
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
# A second start focuses the running window (M2-010). No commands, no page permission.
tauri-plugin-single-instance = { version = "2.5.5", default-features = false }
# The one Markdown parser (ADR-0020): links now (M3-005), the read view later. Without
# default features: no HTML writer, no command-line tool.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# Front matter (M3-007), read with its event parser only: no recursion, no alias
# expansion. Without default features: no encoding detection.
yaml-rust2 = { version = "=0.13.0", default-features = false }

# Reads OneDrive's account folders for the sync-folder warning (M2-010). Already built
# for tauri-build's resource step.
[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[features]
# Test switches for the end-to-end build only (ADR-0019, M2-005): own app data folder
# and a preset folder instead of the dialog. Never enabled in the normal build.
e2e = []


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
ts-rs = "12.0.1"
